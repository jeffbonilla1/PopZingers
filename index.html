  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0d0d0d;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    .bg-gradient {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 20% 50%, #1a0a2e 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, #0a1a2e 0%, transparent 60%);
      pointer-events: none;
    }
    .bg-vinyl {
      position: fixed; right: -80px; top: -80px;
      width: 300px; height: 300px; border-radius: 50%;
      background: repeating-radial-gradient(circle, #1a1a1a 0px, #222 2px, #1a1a1a 4px);
      border: 4px solid #333; opacity: 0.3; z-index: 0;
    }
    .game-wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 640px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.4s ease; }

    /* INTRO */
    .intro { text-align: center; animation: fadeIn 0.6s ease; }
    .intro-eyebrow { font-size: 13px; letter-spacing: 6px; color: #ffcc00; text-transform: uppercase; margin-bottom: 12px; font-family: monospace; }
    .intro-title-pop { font-size: clamp(52px, 12vw, 88px); font-weight: 900; color: #fff; margin: 0 0 4px; line-height: 1; text-shadow: 4px 4px 0px #ffcc00, 8px 8px 0px #ff4455; }
    .intro-title-zingers { font-size: clamp(52px, 12vw, 88px); font-weight: 900; color: #ffcc00; margin: 0 0 20px; line-height: 1; text-shadow: 4px 4px 0px #ff4455; }
    .intro-sub { color: #aaa; font-size: 16px; max-width: 400px; margin: 0 auto 40px; line-height: 1.6; }

    /* BUTTONS */
    .btn-play, .btn-next, .btn-again {
      background: #ffcc00; color: #0d0d0d; border: none;
      font-family: monospace; font-weight: 900; text-transform: uppercase; letter-spacing: 2px;
      cursor: pointer; box-shadow: 4px 4px 0px #ff4455;
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .btn-play { padding: 16px 48px; font-size: 20px; }
    .btn-next, .btn-again { padding: 14px 40px; font-size: 16px; }
    .btn-play:active, .btn-next:active, .btn-again:active {
      transform: translate(4px, 4px); box-shadow: 0 0 0 #ff4455;
    }

    /* QUESTION */
    .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .q-label { font-family: monospace; color: #666; font-size: 13px; letter-spacing: 2px; }
    .q-score { font-family: monospace; color: #ffcc00; font-size: 13px; letter-spacing: 2px; }
    .timer-bar { height: 4px; background: #222; margin-bottom: 24px; border-radius: 2px; }
    .timer-fill { height: 100%; border-radius: 2px; transition: width 1s linear, background 0.5s; }
    .timer-num { text-align: right; font-family: monospace; font-size: 28px; margin-bottom: 16px; font-weight: bold; }
    .zinger-box { background: #111; border: 1px solid #2a2a2a; padding: 24px; margin-bottom: 28px; border-left: 4px solid #ffcc00; }
    .zinger-label { font-size: 11px; letter-spacing: 4px; color: #ffcc00; font-family: monospace; margin-bottom: 12px; }
    .zinger-text { color: #fff; font-size: 18px; line-height: 1.7; font-style: italic; }
    /* PHOTO choices */
    .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .choice-btn {
      background: #111; border: 2px solid #2a2a2a;
      cursor: pointer; padding: 0; overflow: hidden;
      transition: border-color 0.3s, transform 0.1s;
      text-align: left;
    }
    .choice-btn:disabled { cursor: default; }
    .choice-img-wrap { position: relative; padding-top: 75%; background: #1a1a1a; }
    .choice-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; transition: filter 0.3s; }
    .choice-check { position: absolute; top: 8px; right: 8px; background: #00e5a0; color: #000; font-size: 16px; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .choice-name { padding: 10px 12px; font-size: 13px; font-family: monospace; letter-spacing: 1px; transition: color 0.3s; }

    /* TEXT-ONLY choices */
    .choices-text { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .choice-text-btn {
      background: #111; border: 2px solid #2a2a2a;
      cursor: pointer; padding: 20px 16px;
      transition: border-color 0.2s, background 0.2s, transform 0.1s;
      text-align: center; border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      min-height: 72px;
    }
    .choice-text-btn:disabled { cursor: default; }
    .choice-text-btn:not(:disabled):hover { border-color: #ffcc00; }
    .choice-text-btn:active { transform: scale(0.97); }
    .choice-text-name {
      font-family: monospace; font-size: 14px; font-weight: 700;
      letter-spacing: 1px; line-height: 1.4;
      transition: color 0.2s;
    }
    .choice-text-check {
      display: inline-block; margin-left: 8px;
      background: #00e5a0; color: #000; font-size: 12px;
      width: 20px; height: 20px; border-radius: 50%;
      line-height: 20px; text-align: center; font-weight: bold;
      vertical-align: middle;
    }

    /* RESULT */
    .result { text-align: center; animation: fadeIn 0.4s ease; }
    .result-emoji { font-size: clamp(48px, 15vw, 80px); margin-bottom: 16px; }
    .result-title { font-size: clamp(24px, 6vw, 36px); margin: 0 0 8px; font-family: monospace; letter-spacing: 3px; text-transform: uppercase; }
    .result-answer { color: #888; font-family: monospace; margin-bottom: 24px; }
    .result-answer span { color: #ffcc00; font-weight: bold; }
    .fact-box { background: #111; border: 1px solid #2a2a2a; padding: 20px; margin-bottom: 32px; border-left: 4px solid #888; text-align: left; }
    .fact-label { font-size: 11px; letter-spacing: 3px; color: #888; font-family: monospace; margin-bottom: 10px; }
    .fact-text { color: #bbb; font-size: 15px; line-height: 1.7; }

    /* GAMEOVER */
    .gameover { text-align: center; animation: fadeIn 0.5s ease; }
    .gameover-label { font-size: 11px; letter-spacing: 5px; color: #ffcc00; font-family: monospace; margin-bottom: 16px; }
    .gameover-score { font-size: clamp(72px, 20vw, 120px); font-weight: 900; color: #fff; line-height: 1; text-shadow: 4px 4px 0 #ffcc00; }
    .gameover-score span { font-size: 0.4em; color: #555; }
    .gameover-msg { color: #888; margin-bottom: 40px; font-family: monospace; }

    /* INCOMING CHALLENGE + RESULTS */
    .challenged { border: 3px solid #ff4455; background: #140816; padding: 22px 18px; max-width: 420px; margin: -10px auto 30px; box-shadow: 6px 6px 0 #ffcc00; }
    .challenged-label { font-family: monospace; font-size: 15px; letter-spacing: 4px; color: #ff4455; font-weight: 900; margin-bottom: 8px; }
    .challenged-score { font-size: 72px; font-weight: 900; color: #fff; line-height: 1; text-shadow: 3px 3px 0 #ffcc00; }
    .challenged-score span { font-size: 0.4em; color: #888; text-shadow: none; }
    .challenged-text { color: #ddd; font-family: monospace; font-size: 15px; margin-top: 10px; }
    .vs-title { font-family: monospace; font-weight: 900; letter-spacing: 4px; color: #ffcc00; text-align: center; margin-bottom: 12px; }
    .vs-cols { display: flex; justify-content: space-around; text-align: center; }
    .vs-who { font-family: monospace; font-size: 12px; letter-spacing: 3px; color: #888; }
    .vs-num { font-size: 52px; font-weight: 900; color: #fff; line-height: 1.1; }

    /* FINAL-SCREEN CTA */
    .cta-box { background: #111; border: 1px solid #2a2a2a; border-left: 4px solid #ffcc00; padding: 22px; margin: 0 auto 24px; text-align: left; max-width: 480px; }
    .cta-label { font-size: 11px; letter-spacing: 3px; color: #ffcc00; font-family: monospace; margin-bottom: 12px; }
    .cta-text { color: #bbb; font-size: 15px; line-height: 1.6; margin-bottom: 14px; }
    .btn-copy-link { display: block; margin: 14px auto 0; background: none; border: none; color: #888; font-family: monospace; font-size: 13px; text-decoration: underline; cursor: pointer; }
    .btn-copy-link:hover { color: #fff; }
    .cta-green { border-left-color: #00e5a0; }
    .btn-skip { display: block; margin: 16px auto 0; background: none; border: none; color: #aaa; font-family: monospace; font-size: 14px; text-decoration: underline; cursor: pointer; }
    .btn-skip:hover { color: #aaa; }
    .btn-again-link { background: none; border: 2px solid #333; color: #aaa; padding: 10px 26px; font-family: monospace; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; }
    .btn-again-link:hover { border-color: #ffcc00; color: #fff; }

    /* CHALLENGE */
    .challenge-banner { color: #fff; background: #1a0a2e; border: 2px solid #ff4455; padding: 12px 16px; font-family: monospace; font-size: 15px; max-width: 420px; margin: -16px auto 28px; line-height: 1.5; }
    .challenge-banner b { color: #ffcc00; }
    .vs-box { max-width: 480px; margin: 0 auto 20px; background: #111; border: 2px solid #ffcc00; padding: 16px 20px; text-align: left; }
    .vs-row { display: flex; justify-content: space-between; font-family: monospace; font-size: 16px; color: #ccc; padding: 4px 0; }
    .vs-row b { color: #ffcc00; font-size: 20px; }
    .vs-verdict { margin-top: 10px; font-family: monospace; font-weight: 900; color: #fff; letter-spacing: 1px; }
    .challenge-box { background: #111; border: 1px solid #2a2a2a; border-left: 4px solid #00e5a0; padding: 20px; margin: 0 auto 20px; text-align: left; max-width: 480px; }
    .challenge-label { font-size: 11px; letter-spacing: 3px; color: #00e5a0; font-family: monospace; margin-bottom: 10px; }
    .challenge-text { color: #ddd; font-size: 15px; line-height: 1.6; font-style: italic; margin-bottom: 14px; }
    .btn-challenge { width: 100%; background: #00e5a0; color: #0d0d0d; border: none; padding: 14px 18px; font-family: monospace; font-weight: 900; font-size: 16px; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; box-shadow: 4px 4px 0 #ff4455; }
    .btn-challenge:active { transform: translate(4px,4px); box-shadow: 0 0 0 #ff4455; }
    .challenge-tag { color: #888; font-size: 13px; text-align: center; margin-top: 12px; font-family: monospace; }
    .share-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .btn-share { flex: 1 1 auto; background: #0d0d0d; color: #ccc; border: 2px solid #2a2a2a; padding: 10px 12px; font-family: monospace; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
    .btn-share:hover { border-color: #00e5a0; color: #fff; }

    /* RESUME */
    .resume-note { color: #ffcc00; font-family: monospace; font-size: 14px; margin: -16px auto 24px; max-width: 420px; line-height: 1.6; }
    .btn-restart { margin-top: 22px; background: none; border: none; color: #888; font-family: monospace; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; text-decoration: underline; cursor: pointer; }
    .btn-restart:hover { color: #fff; }

    /* BOOKS */
    .book-box { background: #111; border: 1px solid #2a2a2a; border-left: 4px solid #ffcc00; padding: 20px; margin: 0 auto 20px; text-align: left; max-width: 480px; }
    .book-label { font-size: 11px; letter-spacing: 3px; color: #ffcc00; font-family: monospace; margin-bottom: 12px; }
    .book-item + .book-item { margin-top: 16px; padding-top: 16px; border-top: 1px solid #222; }
    .book-hook { color: #ffcc00; font-size: 20px; font-weight: bold; line-height: 1.35; margin-bottom: 14px; }
    .book-title { color: #fff; font-size: 17px; font-weight: bold; margin-bottom: 4px; }
    .book-blurb { color: #aaa; font-size: 14px; line-height: 1.6; }
    .btn-book { display: inline-block; margin-top: 10px; background: #ffcc00; color: #0d0d0d; text-decoration: none; padding: 10px 18px; font-family: monospace; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; font-size: 13px; box-shadow: 3px 3px 0 #ff4455; }

    /* SIGNUP */
    .signup-box { background: #111; border: 1px solid #2a2a2a; border-left: 4px solid #ff4455; padding: 20px; margin: 0 auto 32px; text-align: left; max-width: 480px; }
    .signup-label { font-size: 11px; letter-spacing: 3px; color: #ff4455; font-family: monospace; margin-bottom: 8px; }
    .signup-text { color: #bbb; font-size: 15px; line-height: 1.6; margin-bottom: 14px; }
    .signup-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .signup-input { flex: 1 1 200px; background: #0d0d0d; border: 2px solid #2a2a2a; color: #fff; padding: 12px; font-family: monospace; font-size: 14px; }
    .signup-input:focus { outline: none; border-color: #ffcc00; }
    .btn-signup { background: #ffcc00; color: #0d0d0d; border: none; padding: 12px 20px; font-family: monospace; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; box-shadow: 3px 3px 0 #ff4455; }
    .btn-signup:disabled { opacity: 0.6; cursor: default; }
    .signup-msg { margin-top: 10px; font-family: monospace; font-size: 13px; }
  </style>

      challengeScore = null; challengeFromLink = false;
      try { localStorage.removeItem(CHALLENGE_KEY); } catch (e) {}
    }
    function playAgain() {
      clearChallenge();
      shared = false; skippedShare = false; bookClicked = false;
      startGame();
    }

    function gameURL() { return location.origin + location.pathname; }
    function challengeURL() { return `${gameURL()}?beat=${state.score}`; }
    function challengeMessage() {
      return `I just scored ${state.score}/${questions.length} on PopZingers, the music trivia game for people who remember when MTV played music. Think you can beat me?`;
    }

    function shareNative() {
      const text = challengeMessage(), url = challengeURL();
      if (navigator.share) {
        navigator.share({ title: "PopZingers Challenge", text, url }).then(() => { track("challenge_share", { method: "share_menu", score: state.score }); markShared(); }).catch(() => {});
      } else {
        copyChallenge();
      }
    }
    function copyChallenge() {
      track("challenge_share", { method: "copy_link", score: state.score });
      const full = `${challengeMessage()} ${challengeURL()}`;
      const done = () => {
        const b = document.getElementById("copy-btn");
        if (b) { b.textContent = "Copied! Now paste it to a friend"; } setTimeout(markShared, 1800);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(full).then(done).catch(() => fallbackCopy(full, done));
      } else { fallbackCopy(full, done); }
    }
    function fallbackCopy(text, done) {
      const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(t); done();
    }
    function shareEmail() {
      const subject = encodeURIComponent(`I scored ${state.score}/${questions.length} on PopZingers. Your move.`);
      const body = encodeURIComponent(`${challengeMessage()}\n\n${challengeURL()}`);
      location.href = `mailto:?subject=${subject}&body=${body}`;
    }
    function shareFacebook() {
      window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(challengeURL())}`, "_blank", "noopener");
    }
    function shareLinkedIn() {
      window.open(`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(challengeURL())}`, "_blank", "noopener");
    }

    function challengeResultHTML() {
      if (challengeScore === null) return "";
      const me = state.score, them = challengeScore;
      const verdict = me > them ? "🏆 NEW CHAMPION! You beat your friend. Enjoy those bragging rights."
                    : me === them ? "🤝 DEAD EVEN! Somebody needs a rematch."
                    : "👑 Your friend still wears the crown. Care to challenge someone else?";
      return `
        <div class="vs-box">
          <div class="vs-title">THE RESULTS ARE IN!</div>
          <div class="vs-cols">
            <div class="vs-col"><div class="vs-who">YOUR FRIEND</div><div class="vs-num">${them}</div></div>
            <div class="vs-col"><div class="vs-who">YOU</div><div class="vs-num" style="color:${me >= them ? '#00e5a0' : '#ff4455'}">${me}</div></div>
          </div>
          <div class="vs-verdict">${verdict}</div>
        </div>`;
    }

    function challengeHTML() {
      return `
        <div class="challenge-box">
          <div class="challenge-label">🎤 THINK YOUR FRIENDS CAN DO BETTER?</div>
          <p class="challenge-text">"${challengeMessage()}"</p>
          <button class="btn-challenge" onclick="shareNative()">Challenge a Friend →</button>
          <p class="challenge-tag">Share the challenge. Compare scores. Bragging rights are on the line.</p>
          <div class="share-row">
            <button class="btn-share" id="copy-btn" onclick="copyChallenge()">Copy Challenge Link</button>
            <button class="btn-share" onclick="shareEmail()">Email</button>
            <button class="btn-share" onclick="shareFacebook()">Facebook</button>
            <button class="btn-share" onclick="shareLinkedIn()">LinkedIn</button>
          </div>
        </div>`;
    }

    // ONE CTA ON THE FINAL SCREEN
    // Step 1: Challenge a Friend (people who had fun share it).
    // Step 2: after they share (or tap "not now"), the box flips to the book:
    //         email signup now, Amazon button once BOOKS has a url.
    let shared = false, skippedShare = false, bookClicked = false;
    function markShared() { if (!shared) { shared = true; render(); } }
    function skipShare() { skippedShare = true; track("challenge_skip", { score: state.score }); render(); }
    function bookClick() { bookClicked = true; track("book_click", { score: state.score }); setTimeout(render, 400); }

    function endCTAHTML() {
      if (!shared && !skippedShare) {
        return `
          <div class="cta-box cta-green">
            <div class="cta-label" style="color:#00e5a0;">🎤 THINK YOUR FRIENDS CAN DO BETTER?</div>
            <p class="cta-text">Send your score to a friend and see if they can beat you. Bragging rights are on the line.</p>
            <button class="btn-challenge" onclick="shareNative()">Challenge a Friend →</button>
            <button class="btn-copy-link" id="copy-btn" onclick="copyChallenge()">or copy the challenge link</button>
            <button class="btn-skip" onclick="skipShare()">No thanks, show me what's next →</button>
          </div>`;
      }

      const live = BOOKS.find(b => b.url);
      const book = live || BOOKS[0];

      if (signupStatus === "done" || bookClicked) {
        return `
          <div class="cta-box">
            <div class="cta-label">${bookClicked ? "🎸 ENJOY THE BOOK!" : "🎤 YOU'RE ON THE LIST!"}</div>
            <p class="cta-text">${bookClicked ? "Rock on. Now go throw a party." : "We'll let you know the second it drops. Rock on."}</p>
          </div>`;
      }

      const label = shared ? "🎸 THANKS FOR SHARING!" : (live ? "🎸 GET THE BOOK" : "🎸 COMING SOON");
      const hook = shared ? "Don't let the fun stop. Now you can party like a rock star."
                          : "You survived the trivia. Can you survive being a rock star?";
      const intro = `
        <div class="cta-label">${label}</div>
        <div class="book-hook">${hook}</div>
        <div class="book-title">${book.title}</div>
        <p class="book-blurb">${book.blurb}</p>`;

      if (live) {
        return `
          <div class="cta-box">
            ${intro}
            <a class="btn-book" href="${live.url}" target="_blank" rel="noopener" onclick="bookClick()">Get It on Amazon →</a>
          </div>`;
      }

      const sending = signupStatus === "sending";
      const err = signupStatus === "error"
        ? `<div class="signup-msg" style="color:#ff4455;">Hmm, that didn't go through. Check the address and try again.</div>` : '';
      return `
        <div class="cta-box">
          ${intro}
          <p class="cta-text" style="margin-top:14px;">It's coming soon. Get notified the day it drops. No spam, just zingers.</p>
          <form onsubmit="submitSignup(event)" class="signup-row">
            <input class="signup-input" type="email" name="email" id="signup-email" placeholder="you@example.com" required ${sending ? 'disabled' : ''}>
            <input type="text" name="bot-field" id="signup-bot" style="display:none" tabindex="-1" autocomplete="off">
            <button class="btn-signup" type="submit" ${sending ? 'disabled' : ''}>${sending ? 'Sending...' : 'Notify Me'}</button>
          </form>
          ${err}
        </div>`;
    }

    function resumeGame() {
      const p = loadProgress();
      if (!p) { startGame(); return; }
      state = { screen: "question", currentQ: p.q, selected: null, score: p.score, timeLeft: TIMER_SECONDS, timerActive: true, imgErrors: {} };
      track("game_resume", { question_number: p.q + 1, score: p.score });
      render();
      startTimer();
    }
    // BOOK LINKS: paste the Amazon links here when the books go live.
    // While these are empty, the end screen shows a "coming soon" teaser instead of buy buttons.
    const BOOKS = [
      { title: "Party Like a Rock Star", blurb: "A fill-in-the-blank party game for grown-ups. Your crew calls out the words, then you read the rock star disaster you just created. Perfect for game night, bar night and bachelorettes.", url: "" },
    ];

    function booksHTML() {
      const live = BOOKS.filter(b => b.url);
      if (live.length) {
        return `
          <div class="book-box">
            <div class="book-label">🎸 GET THE BOOK</div>
            <div class="book-hook">You survived the trivia. Can you survive being a rock star?</div>
            ${live.map(b => `
              <div class="book-item">
                <div class="book-title">${b.title}</div>
                <p class="book-blurb">${b.blurb}</p>
                <a class="btn-book" href="${b.url}" target="_blank" rel="noopener">Get It on Amazon →</a>
              </div>`).join('')}
          </div>`;
      }
      return `
        <div class="book-box">
          <div class="book-label">🎸 COMING SOON</div>
          <div class="book-hook">You survived the trivia. Can you survive being a rock star?</div>
          ${BOOKS.map(b => `
            <div class="book-item">
              <div class="book-title">${b.title}</div>
              <p class="book-blurb">${b.blurb}</p>
            </div>`).join('')}
        </div>`;
    }

    let signupStatus = null; // null | "sending" | "done" | "error"

    function signupHTML() {
      if (signupStatus === "done") {
        return `
          <div class="signup-box">
            <div class="signup-label">🎤 YOU'RE ON THE LIST</div>
            <p class="signup-text">Thanks! We'll let you know when the book and new games drop.</p>
          </div>`;
      }
      const sending = signupStatus === "sending";
      const msg = signupStatus === "error"
        ? `<div class="signup-msg" style="color:#ff4455;">Hmm, that didn't go through. Check the address and try again.</div>`
        : '';
      return `
        <div class="signup-box">
          <div class="signup-label">🎤 WANT MORE ZINGERS?</div>
          <p class="signup-text">Be the first to know when the book and new trivia games drop. No spam, just zingers.</p>
          <form onsubmit="submitSignup(event)" class="signup-row">
            <input class="signup-input" type="email" name="email" id="signup-email" placeholder="you@example.com" required ${sending ? 'disabled' : ''}>
            <input type="text" name="bot-field" id="signup-bot" style="display:none" tabindex="-1" autocomplete="off">
            <button class="btn-signup" type="submit" ${sending ? 'disabled' : ''}>${sending ? 'Sending...' : 'Sign Me Up'}</button>
          </form>
          ${msg}
        </div>`;
    }

    async function submitSignup(e) {
      e.preventDefault();
      const email = document.getElementById('signup-email').value.trim();
      const bot = document.getElementById('signup-bot').value;
      if (!email) return;
      signupStatus = "sending";
      render();
      try {
        const body = new URLSearchParams({ "form-name": "signup", email, score: `${state.score}/${questions.length}`, "bot-field": bot });
        const res = await fetch("/", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body.toString() });
        signupStatus = res.ok ? "done" : "error";
        if (res.ok) track("book_signup", { score: state.score });
      } catch (err) {
        signupStatus = "error";
      }
      render();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        state.timeLeft--;
        if (state.timeLeft <= 0) {
          clearInterval(timerInterval);
          state.timerActive = false;
          state.selected = "__timeout__";
          saveProgress(state.currentQ + 1);
          render();
          setTimeout(() => { state.screen = "result"; render(); }, 300);
          return;
        }
        updateTimer();
      }, 1000);
    }

    function stopTimer() { clearInterval(timerInterval); }

    function updateTimer() {
      const fill = document.querySelector('.timer-fill');
      const num = document.querySelector('.timer-num');
      if (!fill || !num) return;
      const pct = (state.timeLeft / TIMER_SECONDS) * 100;
      const color = state.timeLeft > 8 ? '#00e5a0' : state.timeLeft > 4 ? '#ffcc00' : '#ff4455';
      fill.style.width = pct + '%';
      fill.style.background = color;
      num.style.color = color;
      num.textContent = state.timeLeft;
    }

    function startGame() {
      clearProgress();
      track("game_start", { challenged: challengeScore !== null, score_to_beat: challengeScore });
      state = { screen: "question", currentQ: 0, selected: null, score: 0, timeLeft: TIMER_SECONDS, timerActive: true, imgErrors: {} };
      render();
      startTimer();
    }

    function handleAnswer(idx) {
      if (state.selected) return;
      const name = questions[state.currentQ].choices[idx].name;
      stopTimer();
      state.selected = name;
      if (name === questions[state.currentQ].answer) state.score++;
      saveProgress(state.currentQ + 1);
      render();
      setTimeout(() => { state.screen = "result"; render(); }, 300);
    }

    function nextQuestion() {
      if (state.currentQ + 1 >= questions.length) {
        track("game_complete", { score: state.score, challenged: challengeScore !== null, score_to_beat: challengeScore,
          result: challengeScore === null ? "none" : state.score > challengeScore ? "won" : state.score === challengeScore ? "tie" : "lost" });
        clearProgress(); try { localStorage.removeItem(CHALLENGE_KEY); } catch (e) {} state.screen = "gameover"; render(); return; }
      state.currentQ++;
      state.selected = null;
      state.timeLeft = TIMER_SECONDS;
      state.timerActive = true;
      state.screen = "question";
      render();
      startTimer();
    }

    function timerColor() {
      return state.timeLeft > 8 ? '#00e5a0' : state.timeLeft > 4 ? '#ffcc00' : '#ff4455';
    }

    function render() {
      const app = document.getElementById('app');
      const q = questions[state.currentQ];
      const isCorrect = state.selected === q?.answer;
      const timedOut = state.selected === "__timeout__";

      if (state.screen === "intro") {
        app.innerHTML = `
          <div class="intro">
            <div class="intro-eyebrow">🎵 The Game That Rocks</div>
            <h1 class="intro-title-pop">POP</h1>
            <h1 class="intro-title-zingers">ZINGERS</h1>
            <p class="intro-sub">Irreverent music trivia for people who remember when MTV played music.</p>
            ${(() => {
              if (challengeFromLink) return `
                <div class="challenged">
                  <div class="challenged-label">🎸 YOU'VE BEEN CHALLENGED!</div>
                  <div class="challenged-score">${challengeScore}<span>/${questions.length}</span></div>
                  <p class="challenged-text">Your friend scored ${challengeScore}. Think you can beat them?</p>
                </div>
                <button class="btn-play" onclick="startGame()">Accept the Challenge →</button>`;
              const p = loadProgress();
              if (!p) return `<button class="btn-play" onclick="startGame()">Let's Play →</button>`;
              return `
                <p class="resume-note">Welcome back! You were on question ${p.q + 1} of ${questions.length} with a score of ${p.score}.${challengeScore !== null ? ` Score to beat: ${challengeScore}.` : ''}</p>
                <button class="btn-play" onclick="resumeGame()">Keep Playing →</button>
                <div><button class="btn-restart" onclick="playAgain()">Start Over</button></div>`;
            })()}
          </div>`;
      }

      else if (state.screen === "question") {
        const pct = (state.timeLeft / TIMER_SECONDS) * 100;
        const color = timerColor();

        // Detect if this question has any images defined
        const hasPhotos = q.choices && q.choices.some(c => c.img);

        let choicesHTML;

        if (hasPhotos) {
          // PHOTO mode: existing grid layout
          choicesHTML = `<div class="choices">` + q.choices.map((choice, ci) => {
            const isSel = state.selected === choice.name;
            const isAns = choice.name === q.answer;
            let border = '#2a2a2a', bg = '#111', nameColor = '#ccc';
            if (state.selected) {
              if (isAns) { border = '#00e5a0'; bg = '#001a12'; nameColor = '#00e5a0'; }
              else if (isSel) { border = '#ff4455'; bg = '#1a0008'; nameColor = '#ff4455'; }
              else { nameColor = '#555'; }
            }
            const imgSrc = state.imgErrors[choice.name] ? null : choice.img;
            const imgHTML = imgSrc
              ? `<img class="choice-img" src="${imgSrc}" alt="${choice.name}" onerror="handleImgError(${ci})" style="filter:${state.selected && !isAns ? 'grayscale(60%) brightness(0.6)' : 'none'}">`
              : `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;">🎸</div>`;
            const checkHTML = state.selected && isAns ? `<div class="choice-check">✓</div>` : '';
            const transform = isSel ? 'scale(0.97)' : 'scale(1)';
            return `
              <button class="choice-btn" onclick="handleAnswer(${ci})" ${state.selected ? 'disabled' : ''}
                style="border-color:${border}; background:${bg}; transform:${transform};">
                <div class="choice-img-wrap">${imgHTML}${checkHTML}</div>
                <div class="choice-name" style="color:${nameColor}; font-weight:${isAns && state.selected ? 'bold' : 'normal'}">${choice.name}</div>
              </button>`;
          }).join('') + `</div>`;

        } else {
          // TEXT-ONLY mode: clean name buttons, intentionally styled
          choicesHTML = `<div class="choices-text">` + q.choices.map((choice, ci) => {
            const isSel = state.selected === choice.name;
            const isAns = choice.name === q.answer;
            let border = '#2a2a2a', bg = '#111', nameColor = '#ccc';
            if (state.selected) {
              if (isAns) { border = '#00e5a0'; bg = '#001a12'; nameColor = '#00e5a0'; }
              else if (isSel) { border = '#ff4455'; bg = '#1a0008'; nameColor = '#ff4455'; }
              else { nameColor = '#444'; }
            }
            const checkHTML = state.selected && isAns ? `<span class="choice-text-check">✓</span>` : '';
            return `
              <button class="choice-text-btn" onclick="handleAnswer(${ci})" ${state.selected ? 'disabled' : ''}
                style="border-color:${border}; background:${bg};">
                <span class="choice-text-name" style="color:${nameColor};">${choice.name}${checkHTML}</span>
              </button>`;
          }).join('') + `</div>`;
        }

        app.innerHTML = `
          <div class="fade-in">
            <div class="q-header">
              <div class="q-label">Q ${state.currentQ + 1} / ${questions.length}</div>
              <div class="q-score">SCORE: ${state.score}</div>
            </div>
            <div class="timer-bar"><div class="timer-fill" style="width:${pct}%; background:${color};"></div></div>
            <div class="timer-num" style="color:${color};">${state.timeLeft}</div>
            <div class="zinger-box">
              <div class="zinger-label">🎤 THE ZINGER</div>
              <p class="zinger-text">"${q.zinger}"</p>
            </div>
            ${choicesHTML}
          </div>`;
      }

      else if (state.screen === "result") {
        const emoji = timedOut ? "⏰" : isCorrect ? "🎸" : "😬";
        const title = timedOut ? "Time's Up!" : isCorrect ? "Nailed It!" : "Ohhh No...";
        const color = timedOut ? "#ffcc00" : isCorrect ? "#00e5a0" : "#ff4455";
        const btnLabel = state.currentQ + 1 >= questions.length ? "See Results →" : "Next Zinger →";
        app.innerHTML = `
          <div class="result">
            <div class="result-emoji">${emoji}</div>
            <h2 class="result-title" style="color:${color}">${title}</h2>
            <p class="result-answer">The answer was <span>${q.answer}</span></p>
            <div class="fact-box">
              <div class="fact-label">💡 DID YOU KNOW</div>
              <p class="fact-text">${q.funFact}</p>
            </div>
            <button class="btn-next" onclick="nextQuestion()">${btnLabel}</button>
          </div>`;
      }

      else if (state.screen === "gameover") {
        const pct = state.score / questions.length;
        const msg = state.score === questions.length ? "PERFECT SCORE. You ARE the Zinger 🎸"
                  : pct >= 0.9 ? "ROCK GOD STATUS. We bow down."
                  : pct >= 0.7 ? "NICE WORK, ROCK STAR! You know your music."
                  : pct >= 0.5 ? "SOLID. You definitely owned a mixtape."
                  : pct >= 0.3 ? "Not bad for a casual listener."
                  : "Did you even have a radio?";
        app.innerHTML = `
          <div class="gameover">
            <div class="gameover-label">FINAL SCORE</div>
            <div class="gameover-score">${state.score}<span>/${questions.length}</span></div>
            <p class="gameover-msg">${msg}</p>
            ${challengeResultHTML()}
            ${endCTAHTML()}
            <button class="btn-again-link" onclick="playAgain()">Play again</button>
          </div>`;
      }
    }

    function handleImgError(idx) {
      state.imgErrors[questions[state.currentQ].choices[idx].name] = true;
      render();
    }

    // Init
    // Hidden test shortcuts (for testing only, players never see these):
    //   ?end      jumps to the final score screen (?end=37 shows a score of 37)
    //   ?q=50     starts the game at question 50
    const params = new URLSearchParams(location.search);
    if (params.has("end")) {
      const sc = parseInt(params.get("end"), 10);
      state.score = isNaN(sc) ? 0 : Math.max(0, Math.min(sc, questions.length));
      state.screen = "gameover";
      render();
    } else if (params.has("q")) {
      const n = parseInt(params.get("q"), 10);
      startGame();
      if (!isNaN(n) && n >= 1 && n <= questions.length) {
        state.currentQ = n - 1;
        state.timeLeft = TIMER_SECONDS;
        render();
        startTimer();
      }
    } else {
      render();
    }
  </script>
</body>
</html>
